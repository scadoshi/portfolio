     cannot serve a 301, so this is a zero-delay meta refresh plus a canonical
     so the new page keeps the old URL's link equity. Deliberately no noindex:
     paired with a canonical it is a conflicting signal, and Google can apply
     it to the target. Delete once the old URL stops getting traffic. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to /side-quests/steller</title>
<link rel="canonical" href="https://scottyfermo.com/side-quests/steller">
<meta http-equiv="refresh" content="0; url=/side-quests/steller">
</head>
<body>
<p>This page is now at <a href="/side-quests/steller">/side-quests/steller</a>.</p>
</body>
</html>
