<!doctype html>
<!-- Redirects /side-quests/steller, where steller lived as a side quest. GitHub Pages cannot
     serve a 301, so this is a zero-delay meta refresh plus a canonical that
     passes the old address's link equity to the new one. No noindex: beside a
     canonical it is a conflicting signal, and Google can apply it to the
     target. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to /projects/steller</title>
<link rel="canonical" href="https://scottyfermo.com/projects/steller">
<meta http-equiv="refresh" content="0; url=/projects/steller">
</head>
<body>
<p>This page is now at <a href="/projects/steller">/projects/steller</a>.</p>
</body>
</html>
