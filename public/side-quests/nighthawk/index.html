<!doctype html>
<!-- Redirects /side-quests/nighthawk, where chickadee lived under its first name. GitHub Pages cannot
     serve a 301, so this is a zero-delay meta refresh plus a canonical that
     passes the old address's link equity to the new one. No noindex: beside a
     canonical it is a conflicting signal, and Google can apply it to the
     target. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to /side-quests/chickadee</title>
<link rel="canonical" href="https://scottyfermo.com/side-quests/chickadee">
<meta http-equiv="refresh" content="0; url=/side-quests/chickadee">
</head>
<body>
<p>This page is now at <a href="/side-quests/chickadee">/side-quests/chickadee</a>.</p>
</body>
</html>
