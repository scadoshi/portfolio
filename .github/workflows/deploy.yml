name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'index.html'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Backstop: a normal run is well under 10 minutes. Without this a wedged
    # step burns the default job limit before anyone notices.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust
        # Caches the compiled dependency graph (native + wasm). Prunes
        # portfolio's own artifacts so the cache stays lean, and uses
        # restore-keys for partial hits when Cargo.lock changes, a far
        # better hit rate than a raw target/ cache.
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install system dependencies
        # apt is the only step here that talks to a network mirror, and it is
        # the one that wedges: the zwipe repo's equivalent sat for 26 minutes on
        # 2026-08-18 with GitHub reporting no incident. Explicit acquire
        # timeouts, three attempts, and a step timeout turn a mirror stall into
        # a fast failure you can re-run instead of a job that hangs unnoticed.
        timeout-minutes: 6
        run: |
          set -euo pipefail
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update \
              && sudo apt-get $APT_OPTS install -y build-essential; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying" >&2
            sleep $((attempt * 10))
          done
          echo "apt failed three times; the mirror is likely degraded" >&2
          exit 1

      - name: Test
        # sitemap_lists_every_prerendered_route lives here: the sitemap is
        # hand-maintained and has drifted before.
        run: cargo test --locked

      - name: Clippy
        # Three targets because the code differs per target: theme_store is
        # wasm-only, and `server` is the feature the prerender actually runs
        # under. Linting only the default target missed three errors in
        # main.rs for as long as this workflow has existed.
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked --no-default-features --features server --all-targets -- -D warnings

      - name: Install Dioxus CLI
        # Fetches a prebuilt dx binary instead of compiling dioxus-cli from
        # source (which a `cargo install --force` would do on every run, ~minutes).
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Build
        run: dx build --release --ssg --force-sequential

      - name: Add CNAME
        run: echo "scottyfermo.com" > target/dx/portfolio/release/web/public/CNAME

      - name: Add 404.html for SPA routing
        # GitHub Pages serves this for unknown paths. It is the prerendered
        # /404 page (see static_routes in main.rs), not a copy of index.html:
        # the copy carried Home's title, canonical and JSON-LD onto every
        # unknown URL, with no noindex.
        run: cp target/dx/portfolio/release/web/public/404/index.html target/dx/portfolio/release/web/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/portfolio/release/web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
