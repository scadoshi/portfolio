[package]
name = "portfolio"
version = "0.1.0"
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# Parses src/stats.json, the GitHub numbers heron serves.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Shared UI with zwipe.net and cairn (themes, ThemePicker, PageMeta, NavBar
# shell, the site kit). Cargo.lock pins the exact commit; `cargo update -p
# orangui` pulls the latest deliberately.
orangui = { git = "https://github.com/scadoshi/orangui", features = ["toast"] }
# The Orangui page's phone fires toasts through `use_toast`. Pinned to the rev
# orangui pins, so the provider and the hook are one crate.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false }

# build.rs highlights the code snippets in src/data.rs with tree-sitter, and
# tests/highlight.rs checks that output, so both take the same two crates.
[build-dependencies]
lumis = { version = "0.17.1", default-features = false, features = ["lang-rust", "lang-csharp"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
lumis = { version = "0.17.1", default-features = false, features = ["lang-rust", "lang-csharp"] }
syn = { version = "2", features = ["full", "visit"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Asks heron for live numbers after the page loads.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# Library crates flip this to "warn": builders and pure functions get #[must_use].
must_use_candidate = "allow"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"

# dx builds wasm under its own `wasm-release` profile. Left to dioxus-cli's
# default it keeps DWARF, and wasm-opt then aborts inside binaryen's DWARF
# emitter (UNREACHABLE at DWARFEmitter.cpp:201). dx logs that as an ERROR and
# exits 0, so CI stayed green while shipping an unoptimized 2.75MB binary.
# Stripping debug info is what lets wasm-opt run at all.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
