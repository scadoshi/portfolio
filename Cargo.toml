[package]
name = "portfolio"
version = "0.1.0"
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# Parses src/stats.json, the GitHub numbers heron serves.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Shared UI with zwipe.net and cairn (themes, ThemePicker, PageMeta, NavBar
# shell, the site kit). Cargo.lock pins the exact commit; `cargo update -p
# orangui` pulls the latest deliberately.
orangui = { git = "https://github.com/scadoshi/orangui", features = ["toast"] }
# The Orangui page's phone fires toasts through `use_toast`. Pinned to the rev
# orangui pins, so the provider and the hook are one crate.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false }

# build.rs highlights the code snippets in src/data.rs with tree-sitter, and
# tests/highlight.rs checks that output, so both take the same two crates.
[build-dependencies]
lumis = { version = "0.17.1", default-features = false, features = ["lang-rust", "lang-csharp"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
lumis = { version = "0.17.1", default-features = false, features = ["lang-rust", "lang-csharp"] }
syn = { version = "2", features = ["full", "visit"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Asks heron for live numbers after the page loads.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
unwrap_used = "warn"

# dx builds wasm under its own `wasm-release` profile. Left to dioxus-cli's
# default it keeps DWARF, and wasm-opt then aborts inside binaryen's DWARF
# emitter (UNREACHABLE at DWARFEmitter.cpp:201). dx logs that as an ERROR and
# exits 0, so CI stayed green while shipping an unoptimized 2.75MB binary.
# Stripping debug info is what lets wasm-opt run at all.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
